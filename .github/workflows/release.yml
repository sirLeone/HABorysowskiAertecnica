name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/release.json"
      - ".github/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag .github/release.json)
          TITLE=$(jq -r .title .github/release.json)
          PRERELEASE=$(jq -r '.prerelease // false' .github/release.json)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating it"
            args=(--title "$TITLE" --prerelease="$PRERELEASE")
            if [ -f .github/RELEASE_NOTES.md ]; then
              args+=(--notes-file .github/RELEASE_NOTES.md)
            fi
            gh release edit "$TAG" "${args[@]}"
            exit 0
          fi

          args=(--target "$GITHUB_SHA" --title "$TITLE")
          if [ -f .github/RELEASE_NOTES.md ]; then
            args+=(--notes-file .github/RELEASE_NOTES.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
